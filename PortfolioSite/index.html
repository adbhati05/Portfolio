<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: black logo on light browser tabs, white logo on dark ones (switches via a media query inside the SVG). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aditya Bhati - Portfolio</title>
    
    <!-- Primary Meta Tags for SEO (search engine optimization) and acts as a default in case the platform doesn't support the other tags (OpenGraph/Twitter). -->
    <meta name="title" content="Aditya Bhati - Portfolio" />
    <meta name="description" content="Computer Science student interested in full-stack development and ML. Check out my work." />
    
    <!-- Open Graph meta tags for social media and messaging platforms. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://adityabdev.com/" />
    <meta property="og:title" content="Aditya Bhati - Portfolio" />
    <meta property="og:description" content="Computer Science student interested in full-stack development and ML. Check out my work." />
    <meta property="og:image" content="https://adityabdev.com/preview.png" />
    
    <!-- Twitter meta tags in case this site needs to be shared on X. -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://adityabdev.com/" />
    <meta property="twitter:title" content="Aditya Bhati - Portfolio" />
    <meta property="twitter:description" content="Computer Science student interested in full-stack development and ML. Check out my work." />
    <meta property="twitter:image" content="https://adityabdev.com/preview.png" />

    <!-- Fonts (Geist for text, Geist Mono for small labels). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />

    <!-- Applying the saved theme before the page paints, so there's no flash of the wrong theme. Dark is the default. -->
    <script>
      try {
        if (localStorage.getItem("theme") !== "light") document.documentElement.classList.add("dark");
      } catch {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
